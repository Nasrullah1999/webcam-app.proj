<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Camera iOS Web Fully Functional</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="camera-container" id="cameraView">
        <!-- Live Viewfinder -->
        <video id="webcam" autoplay playsinline class="filter-none"></video>
        <canvas id="canvas" class="hidden"></canvas>
        
        <!-- Grid Overlay -->
        <div id="gridOverlay" class="grid-overlay hidden">
            <div class="grid-line"></div>
            <div class="grid-line"></div>
            <div class="grid-line"></div>
            <div class="grid-line"></div>
        </div>

        <!-- Flash Effect -->
        <div id="flashScreen" class="flash-screen hidden"></div>

        <!-- Top Bar Control -->
        <div class="top-bar">
            <button class="icon-btn" id="flashBtn" title="Flash/Lampu">
                <i class="fa-solid fa-bolt-slash"></i>
            </button>
            <button class="icon-btn" id="timerBtn" title="Timer">
                <i class="fa-solid fa-clock"></i> <span id="timerLabel" class="btn-badge">Off</span>
            </button>
            <button class="icon-btn" id="gridBtn" title="Grid Lines">
                <i class="fa-solid fa-border-all"></i>
            </button>
            <button class="icon-btn" id="filterBtn" title="Filter Efek">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </button>
        </div>

        <!-- Countdown Display -->
        <div id="timerCountdown" class="timer-display hidden">3</div>

        <!-- Toast Notification -->
        <div id="statusToast" class="toast hidden">Mengunggah ke Drive...</div>

        <!-- Bottom Controls -->
        <div class="bottom-controls">
            <!-- Filter Options (Hidden by Default) -->
            <div id="filterBar" class="filter-bar hidden">
                <button onclick="setFilter('none')" class="filter-opt active">Normal</button>
                <button onclick="setFilter('mono')" class="filter-opt">Mono</button>
                <button onclick="setFilter('sepia')" class="filter-opt">Warm</button>
                <button onclick="setFilter('cool')" class="filter-opt">Cool</button>
                <button onclick="setFilter('dramatic')" class="filter-opt">Dramatic</button>
            </div>

            <!-- Mode Selector -->
            <div class="mode-selector">
                <span onclick="setMode('CINEMATIC', this)">CINEMATIC</span>
                <span onclick="setMode('VIDEO', this)">VIDEO</span>
                <span onclick="setMode('PHOTO', this)" class="active">PHOTO</span>
                <span onclick="setMode('PORTRAIT', this)">PORTRAIT</span>
                <span onclick="setMode('PANO', this)">PANO</span>
            </div>

            <!-- Shutter & Actions -->
            <div class="shutter-row">
                <!-- Gallery Preview / Modal Opener -->
                <div class="gallery-preview" id="galleryBtn">
                    <img id="lastCaptured" class="hidden" src="" alt="Preview">
                </div>

                <!-- Shutter Button -->
                <button class="shutter-btn" id="captureBtn">
                    <div class="shutter-inner" id="shutterInner"></div>
                </button>

                <!-- Camera Switcher -->
                <button class="icon-btn switch-btn" id="switchBtn">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Gallery Preview Modal -->
    <div id="galleryModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="closeGallery">&times;</span>
            <img id="fullImagePreview" src="" alt="Hasil Foto">
            <div class="modal-actions">
                <a id="downloadLocalBtn" download="foto_ios.jpg" class="btn-action"><i class="fa-solid fa-download"></i> Simpan Lokal</a>
                <a id="driveUrlBtn" target="_blank" class="btn-action drive-btn disabled"><i class="fa-brands fa-google-drive"></i> Buka di Drive</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
